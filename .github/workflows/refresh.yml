name: Refresh weather dashboard

# Rebuilds the dashboard's data every morning on GitHub's servers and commits it.
# GitHub Pages redeploys on each push to main, so the public link stays current
# with no laptop involved. Data comes from the free SEPA + Open-Meteo services —
# no secrets required.
#
# Runs a few times through the day (all after SEPA's 09:00 rain-day figure posts).
# GitHub's scheduled runs are best-effort and can be delayed or dropped, so we
# make several attempts — the job is idempotent (commits only when data changes),
# so the first attempt with fresh data updates the page and the rest are no-ops.
# Times are UTC (09:52 UTC = 10:52 BST / 09:52 GMT). UTC and GMT are the same
# instant; the hour that looks "late" in summer is BST, and it cannot be fixed
# by moving the clock — the 09:00Z rain-day total does not exist before 10:00 BST.
#
# The minutes are odd on purpose — see hydro.yml for the measurement. :45 is a
# congested slot on GitHub's shared scheduler; these runs were starting 56-91
# minutes late. :52 also staggers this job clear of hydro.yml at :38, so the two
# stop queueing behind each other on the shared concurrency group below.

on:
  schedule:
    - cron: "52 9 * * *"
    - cron: "52 12 * * *"
    - cron: "52 16 * * *"
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: refresh-weather
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild dashboard data
        run: node refresh-weather-dashboard.mjs index.html

      - name: Commit if the data changed
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change — weather data already current."
          else
            git commit -m "Refresh weather data ($(date -u +%Y-%m-%d))"
            git push
          fi
