name: Refresh weather dashboard (manual)

# Manual fallback only. The dashboard is normally rebuilt by hydro.yml, on the
# same tick as the hydrology data — see that workflow for why.
#
# This job used to carry its own 09:52 / 12:52 / 16:52 UTC schedule and was the
# only thing updating the public page. GitHub's shared scheduler made that
# unreliable: measured 27-28 Jul 2026, the three slots ran 1-3 hours late and then
# one failed to fire at all, leaving the page a day stale. Adding more slots would
# not have helped — the runs were being dropped, not merely delayed.
#
# The schedule is deliberately gone rather than merely reduced: two workflows
# committing index.html would race on main. Keep it that way. Use the "Run
# workflow" button to force a rebuild between hydro runs.

on:
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

# Shared with hydro.yml, which also pushes index.html to main.
concurrency:
  group: refresh-weather
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild dashboard data
        run: node refresh-weather-dashboard.mjs index.html

      - name: Commit if the data changed
        run: |
          scripts/commit-and-push.sh \
            "Refresh weather dashboard ($(date -u +'%Y-%m-%d %H:%M')Z)" \
            index.html data/dashboard.json
