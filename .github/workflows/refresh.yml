name: Refresh weather dashboard

# Rebuilds the dashboard's data every morning on GitHub's servers and commits it.
# GitHub Pages redeploys on each push to main, so the public link stays current
# with no laptop involved. Data comes from the free SEPA + Open-Meteo services —
# no secrets required.
#
# Runs a few times through the day (all after SEPA's 09:00 rain-day figure posts).
# GitHub's scheduled runs are best-effort and can be delayed or dropped, so we
# make several attempts — the job is idempotent (commits only when data changes),
# so the first attempt with fresh data updates the page and the rest are no-ops.
# Times are UTC (09:45 UTC = 10:45 BST / 09:45 GMT).

on:
  schedule:
    - cron: "45 9 * * *"
    - cron: "45 12 * * *"
    - cron: "45 16 * * *"
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: refresh-weather
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild dashboard data
        run: node refresh-weather-dashboard.mjs index.html

      - name: Commit if the data changed
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No change — weather data already current."
          else
            git commit -m "Refresh weather data ($(date -u +%Y-%m-%d))"
            git push
          fi
