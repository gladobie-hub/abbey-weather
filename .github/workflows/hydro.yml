name: Refresh weather data

# Keeps data/*.json current from SEPA's KiWIS service, so rainfall and river
# questions are answered by fetching one static file rather than querying an API.
# Also rebuilds the public dashboard (index.html) on the same tick.
#
# The dashboard used to refresh on its own 3-a-day cron in refresh.yml. It was the
# least reliable thing in the repo — on 27 Jul 2026 its three slots landed 1-3
# hours late, and on the 28th the 09:52 slot never fired at all, leaving the public
# page a day stale while data/ was current. Riding on this job instead means the
# page updates on whichever run first lands after the 09:00Z day closes. That is
# also why refresh.yml no longer has a schedule: two workflows writing index.html
# would race.
#
# Two schedules:
#   hourly     — latest.json + recent-15min.json (current conditions)
#   09:38 UTC  — adds daily.json + monthly.json, after the 09:00 UTC
#                hydrological day closes and SEPA posts the day's total
#
# Hourly is deliberate rather than every-30-minutes: SEPA reports at 15-minute
# intervals, GitHub's scheduled runs drift 5-30 minutes, and the raw CDN caches
# for ~5 minutes, so readings are 25-50 minutes old regardless. Halving the cron
# would double the commit count to buy accuracy the pipeline cannot deliver.
#
# Scheduled runs are best-effort — GitHub gives no timing guarantee. The job is
# idempotent and commits only on change, so a missed run costs nothing.
#
# The minutes are odd on purpose. GitHub's shared scheduler is heavily
# oversubscribed at :00, :15, :30 and :45, and deprioritises free-tier jobs
# queued there. On "0 * * * *" this workflow was starting 8-59 minutes late
# (~35 min average) and whole hours were being dropped — 02:08, then nothing
# until 06:20, measured 26-27 Jul 2026. An uncontended minute is the documented
# mitigation. Keep these off the quarter-hours.

on:
  schedule:
    - cron: "17 * * * *" # hourly, current conditions
    - cron: "38 9 * * *" # daily rollup, just after the 09:00Z hydrological day closes
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild daily.json and monthly.json from 2005"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with refresh.yml, which is now manual-only: both push to main, and
# serialising them avoids racing on the same branch.
concurrency:
  group: refresh-weather
  cancel-in-progress: false

jobs:
  hydro:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The rollup cron and the manual "full" tick also rebuild the history.
      # NB: this string must match the rollup cron above exactly. If they drift
      # apart the job still succeeds — it just quietly stops rebuilding
      # daily.json/monthly.json and never runs the boundary audit.
      - name: Decide scope
        id: scope
        run: |
          if [ "${{ github.event.schedule }}" = "38 9 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo "args=--daily" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # Exits non-zero on a parse failure, a stale feed, or a hydrological-day
      # mismatch, so GitHub emails rather than publishing a wrong-but-plausible file.
      - name: Fetch SEPA hydrology
        run: node scripts/fetch-hydro.mjs ${{ steps.scope.outputs.args }}

      # Commit the hydrology data before touching the dashboard, so that if
      # Open-Meteo is down the data/ update is already banked rather than lost
      # with the run.
      - name: Commit if the hydrology data changed
        run: |
          scripts/commit-and-push.sh \
            "Refresh hydrology data ($(date -u +'%Y-%m-%d %H:%M')Z)" data/

      # Rebuilds only the #almanac-data JSON block in index.html. Deliberately not
      # continue-on-error: if the dashboard sources break, the run should redden
      # and email rather than quietly leave a stale page looking current.
      - name: Rebuild the dashboard
        run: node refresh-weather-dashboard.mjs index.html

      - name: Commit if the dashboard changed
        run: |
          scripts/commit-and-push.sh \
            "Refresh weather dashboard ($(date -u +'%Y-%m-%d %H:%M')Z)" index.html

      # The inline check in every run usually has no power — it only sees ~10 days
      # and most days can't distinguish a 09:00Z boundary from a 09:00-local one.
      # Once a day, audit a full year, where discriminating days are guaranteed.
      # Runs after the commit so a boundary change reddens the job and emails
      # without also costing that run's data update.
      - name: Audit the hydrological-day boundary
        if: steps.scope.outputs.args == '--daily'
        run: node scripts/fetch-hydro.mjs --verify-history 365
