<script>
function render(DATA) {
  const { days, weekly, lastYear } = DATA;

  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); }
  function fmtDay(s) { const d = parseISO(s); return { dow: DOW[d.getUTCDay()], dm: `${d.getUTCDate()} ${MON[d.getUTCMonth()]}` }; }
  function fmtLong(s) { const d = parseISO(s); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }

  // Masthead
  document.getElementById("mast-sub").innerHTML =
    `<span><b>${DATA.location}</b></span>` +
    `<span>Rain day ending 09:00, updated <b>${fmtLong(DATA.updated)}</b></span>` +
    `<span>${DATA.source}</span>`;

  // Weekly card
  document.getElementById("week-title").textContent = `Week ending ${fmtLong(weekly.weekEnding)}`;
  document.getElementById("week-stats").innerHTML = `
    <div class="wstat rain"><div class="k">Total rain</div><div class="v">${weekly.totalRain}<small> mm</small></div></div>
    <div class="wstat temp"><div class="k">Avg range</div><div class="v">${weekly.avgMin}&ndash;${weekly.avgMax}<small> &deg;C</small></div></div>
    <div class="wstat"><div class="k">Max wind</div><div class="v">${weekly.maxWind}<small> mph</small></div></div>`;

  // Same-week-last-year comparison
  if (lastYear && lastYear.weekly) {
    const ly = lastYear.weekly;
    const arrow = (cur, prev, unit, dp = 1) => {
      const diff = cur - prev;
      if (Math.abs(diff) < (dp === 0 ? 0.5 : 0.05)) return `<span class="delta">&middot; no change</span>`;
      const glyph = diff > 0 ? "&#9650;" : "&#9660;";
      return `<span class="delta">${glyph} ${Math.abs(diff).toFixed(dp)} ${unit}</span>`;
    };
    document.getElementById("week-compare").innerHTML =
      `<span class="cmp-label">Same week ${lastYear.label}</span>` +
      `<span class="cmp">Rain <b>${ly.totalRain} mm</b> ${arrow(weekly.totalRain, ly.totalRain, "mm")}</span>` +
      `<span class="cmp">Range <b>${ly.avgMin}&ndash;${ly.avgMax}&deg;C</b></span>` +
      `<span class="cmp">Max wind <b>${ly.maxWind} mph</b> ${arrow(weekly.maxWind, ly.maxWind, "mph", 0)}</span>`;
  }

  // Latest-day tiles
  const latest = days[days.length - 1];
  document.getElementById("tiles").innerHTML = `
    <div class="tile"><div class="k"><span class="dot" style="background:var(--accent)"></span>Rainfall</div><div class="v">${latest.rain}<small> mm</small></div></div>
    <div class="tile"><div class="k"><span class="dot" style="background:var(--warm)"></span>Temperature</div><div class="v">${latest.tmin}&ndash;${latest.tmax}<small> &deg;C</small></div></div>
    <div class="tile"><div class="k"><span class="dot" style="background:var(--muted)"></span>Wind max</div><div class="v">${latest.wind}<small> mph</small></div></div>`;

  // ── Chart: two panels (temp range, rainfall), 2026 vs 2025 overlaid ──
  (function drawChart() {
    const prev = (lastYear && lastYear.days) || [];
    const W = 720, padL = 40, padR = 14;
    const iw = W - padL - padR;
    const OFF = 4.5, BW = 5; // paired-series x-offset and bar width
    const n = days.length;
    const x = i => padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);

    // Temperature panel bounds (include both years)
    const allT = [...days, ...prev];
    let lo = Math.floor(Math.min(...allT.map(d => d.tmin)) - 2);
    let hi = Math.ceil(Math.max(...allT.map(d => d.tmax)) + 2);
    const tTop = 28, tH = 128, tBot = tTop + tH;
    const yT = v => tBot - ((v - lo) / (hi - lo)) * tH;

    // Rainfall panel bounds
    const maxRain = Math.max(5, ...days.map(d => d.rain), ...prev.map(d => d.rain));
    const rTop = 190, rH = 62, rBot = rTop + rH;
    const yR = mm => rBot - (mm / maxRain) * rH;
    const H = 282;

    let g = "";

    // Panel captions
    g += `<text class="g-cap" x="${padL}" y="16">Temperature range &deg;C</text>`;
    g += `<text class="g-cap" x="${padL}" y="178">Rainfall mm</text>`;

    // Temp gridlines + axis
    const step = (hi - lo) <= 14 ? 4 : 5;
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      g += `<line class="g-grid" x1="${padL}" y1="${yT(v).toFixed(1)}" x2="${W - padR}" y2="${yT(v).toFixed(1)}"/>`;
      g += `<text class="g-axis" x="${padL - 6}" y="${(yT(v) + 3).toFixed(1)}" text-anchor="end">${v}&deg;</text>`;
    }
    // Temp capsules — prev (left, faded) then cur (right)
    days.forEach((d, i) => {
      const p = prev[i];
      if (p) g += `<line class="g-temp-prev" x1="${(x(i) - OFF).toFixed(1)}" y1="${yT(p.tmax).toFixed(1)}" x2="${(x(i) - OFF).toFixed(1)}" y2="${yT(p.tmin).toFixed(1)}"/>`;
      g += `<line class="g-temp-cur" x1="${(x(i) + OFF).toFixed(1)}" y1="${yT(d.tmax).toFixed(1)}" x2="${(x(i) + OFF).toFixed(1)}" y2="${yT(d.tmin).toFixed(1)}"/>`;
    });

    // Rain baseline + max tick
    g += `<line class="g-grid" x1="${padL}" y1="${rBot}" x2="${W - padR}" y2="${rBot}"/>`;
    g += `<text class="g-axis" x="${padL - 6}" y="${rTop + 4}" text-anchor="end">${maxRain}</text>`;
    g += `<text class="g-axis" x="${padL - 6}" y="${rBot + 3}" text-anchor="end">0</text>`;
    // Rain bars — prev (left, faded) then cur (right)
    days.forEach((d, i) => {
      const p = prev[i];
      if (p && p.rain > 0) {
        const y = yR(p.rain);
        g += `<rect class="g-rain-prev" x="${(x(i) - OFF - BW / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${BW}" height="${(rBot - y).toFixed(1)}" rx="1.5"/>`;
      }
      if (d.rain > 0) {
        const y = yR(d.rain);
        g += `<rect class="g-rain-cur" x="${(x(i) + OFF - BW / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${BW}" height="${(rBot - y).toFixed(1)}" rx="1.5"/>`;
      }
    });

    // Day labels (every other + last)
    days.forEach((d, i) => {
      if (i % 2 === 0 || i === n - 1) {
        g += `<text class="g-daylabel" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${fmtDay(d.date).dm}</text>`;
      }
    });

    document.getElementById("chart").innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperature range and rainfall over the last 14 days, 2026 compared with 2025">${g}</svg>`;
  })();

  // ── Ledger ──
  const maxRainLedger = Math.max(1, ...days.map(d => d.rain));
  document.getElementById("ledger").innerHTML = days.slice().reverse().map(d => {
    const f = fmtDay(d.date);
    const pct = Math.max(d.rain > 0 ? 6 : 0, (d.rain / maxRainLedger) * 100);
    return `<tr>
      <td class="date"><b>${f.dow}</b> ${f.dm}</td>
      <td class="rainbar-cell"><div class="rainbar"><i style="width:${pct.toFixed(0)}%"></i></div></td>
      <td class="${d.rain > 0 ? "rain-mm" : "rain-mm dry"}">${d.rain > 0 ? d.rain + " mm" : "&mdash;"}</td>
      <td class="temp-range">${d.tmin}<small> / </small>${d.tmax}</td>
      <td class="wind-v">${d.wind} mph</td>
    </tr>`;
  }).join("");

  // ── Footer ──
  document.getElementById("footer").innerHTML =
    `Rainfall from the <b>SEPA on-farm gauge</b> at Abbey St Bathans (station 36870), reported on the UK hydrological rain-day (09:00&rarr;09:00). ` +
    `Temperature and wind from <b>Open-Meteo</b>, observed-blend for completed days. ` +
    `Last year (${lastYear ? lastYear.label : "prior"}) from the <b>SEPA</b> and <b>Open-Meteo archives</b> for the matching dates. ` +
    `Logged automatically to the Farm Almanac &mdash; no manual entry.`;
}

// Render the baked-in copy first so the page is never blank and never waits on a
// network round trip, then replace it with a freshly fetched copy.
//
// This two-step exists because GitHub Pages serves HTML with
// `cache-control: max-age=600` and that header cannot be overridden on Pages. A
// cached page meant cached numbers, because the data was baked into the HTML — the
// symptom was a dashboard that stayed stale until you cleared the browser cache by
// hand, on every device. data/dashboard.json carries the same payload and is
// fetched with a cache-buster, so what you see is always current even when the
// surrounding HTML is served from cache.
//
// If the fetch fails we keep the baked copy: it is the last known good, and a
// slightly old figure beats an empty page. Don't remove the baked block.
render(JSON.parse(document.getElementById("almanac-data").textContent));

fetch(`data/dashboard.json?t=${Date.now()}`, { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
  .then(render)
  .catch((e) => console.warn("Live data fetch failed, showing baked-in copy:", e.message));
</script>

</body>
</html>
